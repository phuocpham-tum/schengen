<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tabbed Web Console</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

<style>
    body {
        margin: 0;
    }

    .console_container {
        width: 100%;
        height: 250px;
        border-radius: 0px;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font-family: monospace;
        color: #000000;
    }

    /* Tabs */
    .tabs {
        display: flex;
        border-bottom: 1px solid #333;
        flex-shrink: 0;
    }

    .tab {
        padding: 10px 15px;
        cursor: pointer;
        border-right: 1px solid #333;
        user-select: none;
    }

    .tab.active {
        background-color: #000;
        font-weight: bold;
        color: #ffffff;
    }

    /* Content container */
    .content {
        flex: 1;
        display: none;
        overflow: hidden; /* important */
    }

    .content.active {
        display: flex;
        flex-direction: column;
    }

    /* Console layout */
    .output {
        flex: 1;                 /* take remaining space */
        overflow-y: auto;        /* scroll only here */
        padding: 15px;
    }

    .input-line {
        display: flex;
        align-items: center;
        /* padding: 10px 15px; */
        padding: 0px 15px;
        border-top: 1px solid #ccc;
        flex-shrink: 0;          /* prevent shrinking */
        background: #fff;
    }

    .prompt {
        margin-right: 5px;
    }

    input[type="text"] {
        background: none;
        border: none;
        outline: none;
        color: #000000;
        font-family: monospace;
        font-size: 16px;
        flex: 1;
    }

    .command {
        margin-bottom: 5px;
        white-space: pre-wrap;
        word-break: break-word;
    }

    /* Selection tab */
    .selection-content {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
    }

    .checkbox-item {
        margin-bottom: 8px;
    }
</style>


</head>
<body>

<div class="console_container">

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" data-tab="0">Terminal</div>
        <div class="tab" data-tab="1">Messages</div>
    </div>

    <!-- Console Tab -->
    <div class="content active" id="consoleTab">
        <div class="output" id="output"></div>
        <div class="input-line">
            <span class="prompt">&gt;</span>
            <input type="text" id="commandInput" autofocus />
        </div>
    </div>

    <!-- Selection Tab -->
    <div class="content" id="selectionTab">
        <div class="output" id="output_messages"></div>
    </div>
</div>

<script>
let currentTab = 0;

const histories = { 0: [], 1: ["initialize...", "loading all available constraints..."] }; // separate histories for each tab

const tabs = document.querySelectorAll(".tab");
const consoleTab = document.getElementById("consoleTab");
const selectionTab = document.getElementById("selectionTab");
const input = document.getElementById("commandInput");
const output = document.getElementById("output");
const outputTab2 = document.getElementById("output_messages");

function renderOutput() {

    const target_output = currentTab === 0 ? output : outputTab2;
    target_output.innerHTML = "";
    histories[currentTab].forEach(cmd => {
        const div = document.createElement("div");
        div.className = "command";
        div.textContent = "> " + cmd;
        target_output.appendChild(div);
    });

    target_output.scrollTop = target_output.scrollHeight; // scroll only output
}

function switchTab(tabIndex) {
    currentTab = tabIndex;

    tabs.forEach(tab => tab.classList.remove("active"));
    document.querySelector(`.tab[data-tab='${tabIndex}']`).classList.add("active");

    consoleTab.classList.remove("active");
    selectionTab.classList.remove("active");

    if (tabIndex === 0) {
        consoleTab.classList.add("active");
        input.focus();
    } else {
        selectionTab.classList.add("active");
    }
    renderOutput();
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && currentTab === 0) {
        const commandText = input.value.trim();
        if (commandText !== "") {
            histories[0].push(commandText);
            renderOutput();
            input.value = "";
        }
    }
});

tabs.forEach(tab => {
    tab.addEventListener("click", () => {
        switchTab(parseInt(tab.dataset.tab));
    });
});
</script>

</body>
</html>
